  publish-evidence-gate:
    needs: [build, provenance-evidence-gate, provenance-release-gate]
    runs-on: ubuntu-latest
    environment: pypi-evidence-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-evidence-gate-${{ needs.build.outputs.target_sha }}
          path: dist/pypi/evidence-gate
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi/evidence-gate/
          attestations: true
          print-hash: true
          skip-existing: false

  publish-release-gate:
    needs: [build, provenance-evidence-gate, provenance-release-gate]
    runs-on: ubuntu-latest
    environment: pypi-release-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-release-gate-${{ needs.build.outputs.target_sha }}
          path: dist/pypi/release-gate
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi/release-gate/
          attestations: true
          print-hash: true
          skip-existing: false

  verify-pypi:
    needs: [build, publish-evidence-gate, publish-release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ needs.build.outputs.target_sha }}
          path: dist/release
      - run: python -m pip install --require-hashes -r requirements/release.lock
      - name: Match public PyPI files to the immutable manifest and attestations
        run: |
          python scripts/release-await-pypi.py \
            --version "${RELEASE_VERSION}" \
            --manifest dist/release/RELEASE-MANIFEST.json \
            --timeout 300
          python scripts/verify-public-release.py \
            --version "${RELEASE_VERSION}" \
            --manifest dist/release/RELEASE-MANIFEST.json

  publish-mcp-evidence-gate:
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    environment: mcp-registry-evidence-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ needs.build.outputs.target_sha }}
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-publisher-${{ needs.build.outputs.target_sha }}
          path: dist/mcp-publisher
      - name: Publish only the fixed Evidence Gate manifest
        run: |
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  dist/mcp-publisher/mcp-publisher.tar.gz" | sha256sum --check --strict
          chmod 0755 dist/mcp-publisher/mcp-publisher
          dist/mcp-publisher/mcp-publisher login github-oidc
          dist/mcp-publisher/mcp-publisher publish dist/release/registry/evidence-gate.server.json

  publish-mcp-release-gate:
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    environment: mcp-registry-release-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ needs.build.outputs.target_sha }}
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-publisher-${{ needs.build.outputs.target_sha }}
          path: dist/mcp-publisher
      - name: Publish only the fixed Release Gate manifest
        run: |
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  dist/mcp-publisher/mcp-publisher.tar.gz" | sha256sum --check --strict
          chmod 0755 dist/mcp-publisher/mcp-publisher
          dist/mcp-publisher/mcp-publisher login github-oidc
          dist/mcp-publisher/mcp-publisher publish dist/release/registry/release-gate.server.json

  verify-mcp-registry:
    needs: [build, publish-mcp-evidence-gate, publish-mcp-release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ needs.build.outputs.target_sha }}
          path: dist/release
      - name: Fetch both public registry records without authentication
        run: |
          set -euo pipefail
          mkdir -p dist/registry-public
          curl --fail --location --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 --max-time 45 \
            --max-filesize 1048576 \
            --output dist/registry-public/evidence-gate.json \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.dailyaiagents%2Fevidence-gate/versions/${RELEASE_VERSION}"
          curl --fail --location --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 --max-time 45 \
            --max-filesize 1048576 \
            --output dist/registry-public/release-gate.json \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.dailyaiagents%2Frelease-gate/versions/${RELEASE_VERSION}"
      - name: Match public records to the fixed release manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def require_subset(expected, actual, location="server"):
              if isinstance(expected, dict):
                  if not isinstance(actual, dict):
                      raise SystemExit(f"{location}: expected object")
                  for key, value in expected.items():
                      if key not in actual:
                          raise SystemExit(f"{location}: missing {key}")
                      require_subset(value, actual[key], f"{location}.{key}")
              elif isinstance(expected, list):
                  if not isinstance(actual, list) or len(actual) != len(expected):
                      raise SystemExit(f"{location}: list mismatch")
                  for index, value in enumerate(expected):
                      require_subset(value, actual[index], f"{location}[{index}]")
              elif expected != actual:
                  raise SystemExit(f"{location}: expected {expected!r}, got {actual!r}")

          for package in ("evidence-gate", "release-gate"):
              expected = json.loads(
                  Path(f"dist/release/registry/{package}.server.json").read_text()
              )
              response = json.loads(
                  Path(f"dist/registry-public/{package}.json").read_text()
              )
              actual = response.get("server")
              if not isinstance(actual, dict):
                  raise SystemExit(f"{package}: public response omits server")
              require_subset(expected, actual)
              official = response.get("_meta", {}).get(
                  "io.modelcontextprotocol.registry/official", {}
              )
              if official.get("status") != "active":
                  raise SystemExit(f"{package}: public record is not active")
          print("public MCP registry verification PASS: 2/2 exact declared records active")
          PY

  github-release:
    needs:
      - build
      - provenance-evidence-gate
      - provenance-release-gate
      - verify-mcp-registry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_TARGET_SHA: ${{ needs.build.outputs.target_sha }}
      WORKFLOW_CONFIG_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ needs.build.outputs.target_sha }}
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: evidence-gate-provenance-${{ needs.build.outputs.target_sha }}
          path: dist/provenance/evidence-gate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-gate-provenance-${{ needs.build.outputs.target_sha }}
          path: dist/provenance/release-gate
      - name: Create immutable release bundle and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_bundles=(dist/provenance/evidence-gate/*)
          release_bundles=(dist/provenance/release-gate/*)
          [[ "${#evidence_bundles[@]}" -eq 1 && "${#release_bundles[@]}" -eq 1 ]]
          cp "${evidence_bundles[0]}" dist/evidence-gate-provenance.sigstore.json
          cp "${release_bundles[0]}" dist/release-gate-provenance.sigstore.json
          (cd dist && sha256sum ./*-gate-provenance.sigstore.json > PROVENANCE-SHA256SUMS)
          for artifact in dist/release/evidence-gate/*.whl dist/release/evidence-gate/*.tar.gz; do
            gh attestation verify "$artifact" \
              --bundle dist/evidence-gate-provenance.sigstore.json \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml" \
              --signer-digest "${WORKFLOW_CONFIG_SHA}" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done
          for artifact in dist/release/release-gate/*.whl dist/release/release-gate/*.tar.gz; do
            gh attestation verify "$artifact" \
              --bundle dist/release-gate-provenance.sigstore.json \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml" \
              --signer-digest "${WORKFLOW_CONFIG_SHA}" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH:-0}" --owner=0 --group=0 --numeric-owner \
            -czf "dist/daily-ai-agent-toolkit-${RELEASE_TAG}-release-bundle.tar.gz" -C dist release
          gh release create "${RELEASE_TAG}" \
            dist/release/SHA256SUMS \
            dist/release/RELEASE-MANIFEST.json \
            dist/release/evidence-gate/* \
            dist/release/release-gate/* \
            dist/release/demo/* \
            dist/release/docs/* \
            dist/release/registry/* \
            dist/*-gate-provenance.sigstore.json \
            dist/PROVENANCE-SHA256SUMS \
            "dist/daily-ai-agent-toolkit-${RELEASE_TAG}-release-bundle.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Daily AI Agent Toolkit ${RELEASE_TAG}" \
            --draft
          mkdir -p dist/draft-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*' \
            --dir dist/draft-assets
          python - <<'PY'
          import hashlib
          from pathlib import Path

          source_patterns = (
              "dist/release/SHA256SUMS",
              "dist/release/RELEASE-MANIFEST.json",
              "dist/release/evidence-gate/*",
              "dist/release/release-gate/*",
              "dist/release/demo/*",
              "dist/release/docs/*",
              "dist/release/registry/*",
              "dist/*-gate-provenance.sigstore.json",
              "dist/PROVENANCE-SHA256SUMS",
              "dist/daily-ai-agent-toolkit-*-release-bundle.tar.gz",
          )
          sources = []
          for pattern in source_patterns:
              sources.extend(Path().glob(pattern))
          expected = {path.name: path for path in sources if path.is_file()}
          if len(expected) != len(sources):
              raise SystemExit("draft source asset names are not unique")
          downloaded = {
              path.name: path for path in Path("dist/draft-assets").iterdir() if path.is_file()
          }
          if downloaded.keys() != expected.keys():
              raise SystemExit("uploaded draft asset inventory mismatch")
          for name, source in expected.items():
              left = hashlib.sha256(source.read_bytes()).digest()
              right = hashlib.sha256(downloaded[name].read_bytes()).digest()
              if left != right:
                  raise SystemExit(f"uploaded draft asset digest mismatch: {name}")
          print(f"authenticated draft asset verification PASS: {len(expected)}")
          PY
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

  verify-github-release:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_TARGET_SHA: ${{ needs.build.outputs.target_sha }}
      WORKFLOW_CONFIG_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Verify immutable release attestation and anonymous asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=false
          for _ in {1..12}; do
            if gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "${verified}" == "true" ]]
          mkdir -p dist/public-assets dist/download
          curl --fail --location --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 --max-time 45 \
            --max-filesize 5242880 \
            --output dist/release.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          curl --fail --location --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 --max-time 45 \
            --max-filesize 1048576 \
            --output dist/tag-ref.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          tag_object_sha="$(jq -r .object.sha dist/tag-ref.json)"
          [[ "$(jq -r .object.type dist/tag-ref.json)" == "tag" ]]
          [[ "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --location --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 --max-time 45 \
            --max-filesize 1048576 \
            --output dist/tag-object.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}"
          [[ "$(jq -r .verification.verified dist/tag-object.json)" == "true" ]]
          [[ "$(jq -r .verification.reason dist/tag-object.json)" == "valid" ]]
          [[ "$(jq -r .object.sha dist/tag-object.json)" == "${RELEASE_TARGET_SHA}" ]]
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          expected = {
              "SHA256SUMS",
              "RELEASE-MANIFEST.json",
              "dailyaiagents_evidence_gate-0.1.0-py3-none-any.whl",
              "dailyaiagents_evidence_gate-0.1.0.tar.gz",
              "evidence-gate.sbom.cdx.json",
              "dailyaiagents_release_gate-0.1.0-py3-none-any.whl",
              "dailyaiagents_release_gate-0.1.0.tar.gz",
              "release-gate.sbom.cdx.json",
              "daily-ai-agent-toolkit-demo-v0.1.0.mp4",
              "daily-ai-agent-toolkit-demo-v0.1.0.srt",
              "DEMO-TRANSCRIPT.md",
              "TECHNICAL-REPORT.md",
              "evidence-gate.server.json",
              "release-gate.server.json",
              "evidence-gate-provenance.sigstore.json",
              "release-gate-provenance.sigstore.json",
              "PROVENANCE-SHA256SUMS",
              f"daily-ai-agent-toolkit-{os.environ['RELEASE_TAG']}-release-bundle.tar.gz",
          }
          release = json.loads(Path("dist/release.json").read_text())
          if release.get("tag_name") != os.environ["RELEASE_TAG"]:
              raise SystemExit("release tag mismatch")
          if release.get("immutable") is not True:
              raise SystemExit("release is not immutable")
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("release is not final")
          assets = release.get("assets", [])
          names = {asset.get("name") for asset in assets}
          if names != expected or len(assets) != len(expected):
              raise SystemExit(
                  f"release asset mismatch: missing={sorted(expected - names)}, "
                  f"unexpected={sorted(names - expected)}"
              )
          output = Path("dist/public-assets")
          for asset in assets:
              name = asset["name"]
              destination = output / name
              expected_size = asset.get("size")
              if not isinstance(expected_size, int) or not 0 < expected_size <= 536_870_912:
                  raise SystemExit(f"invalid or excessive GitHub asset size for {name}")
              for attempt in range(1, 4):
                  try:
                      digest = hashlib.sha256()
                      received = 0
                      with urllib.request.urlopen(
                          asset["browser_download_url"], timeout=60
                      ) as response, destination.open("wb") as handle:
                          while chunk := response.read(1024 * 1024):
                              received += len(chunk)
                              if received > expected_size:
                                  raise RuntimeError(f"oversized GitHub asset: {name}")
                              digest.update(chunk)
                              handle.write(chunk)
                      if received != expected_size:
                          raise RuntimeError(f"truncated GitHub asset: {name}")
                      break
                  except Exception:
                      destination.unlink(missing_ok=True)
                      if attempt == 3:
                          raise
                      time.sleep(2)
              actual = "sha256:" + digest.hexdigest()
              if asset.get("digest") != actual:
                  raise SystemExit(f"GitHub API digest mismatch for {name}")
          print(f"anonymous GitHub asset verification PASS: {len(assets)}/{len(expected)}")
          PY
          for asset in dist/public-assets/*; do
            gh release verify-asset "${RELEASE_TAG}" "${asset}" \
              --repo "${GITHUB_REPOSITORY}"
          done
          (cd dist/public-assets && sha256sum --check PROVENANCE-SHA256SUMS)
          cp "dist/public-assets/daily-ai-agent-toolkit-${RELEASE_TAG}-release-bundle.tar.gz" \
            dist/download/
          tar -xzf dist/download/*.tar.gz -C dist/download
          (cd dist/download/release && sha256sum --check SHA256SUMS)
          for artifact in dist/download/release/evidence-gate/*.whl \
            dist/download/release/evidence-gate/*.tar.gz \
            dist/download/release/release-gate/*.whl \
            dist/download/release/release-gate/*.tar.gz; do
            gh attestation verify "$artifact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml" \
              --signer-digest "${WORKFLOW_CONFIG_SHA}" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done
