name: release-toolkit

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  MCP_PUBLISHER_VERSION: '1.8.1'
  MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated signed tag, main reachability, and prior CI
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" == "tag" ]]
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          tag_object="$(git rev-parse "${GITHUB_REF_NAME}^{tag}")"
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .verification.verified)" == "true" ]]
          check_runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
          CHECK_RUNS="$check_runs" python - <<'PY'
          import json, os
          payload = json.loads(os.environ["CHECK_RUNS"])
          successful = {
              row["name"] for row in payload.get("check_runs", [])
              if row.get("status") == "completed" and row.get("conclusion") == "success"
          }
          required_prefixes = ("test (", "dependency-audit")
          if sum(name.startswith("test (") for name in successful) < 6:
              raise SystemExit("six successful test-matrix checks are required before tagging")
          if not any(name == "dependency-audit" for name in successful):
              raise SystemExit("successful dependency-audit check is required before tagging")
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked release and runtime environments
        run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --require-hashes -r requirements/release.lock
          python -m pip install --no-deps -e servers/evidence-gate -e servers/release-gate
      - name: Verify source, dependencies, and release metadata
        run: |
          bash scripts/test-all.sh
          pip-audit --strict --require-hashes --no-deps -r requirements/runtime.lock
          args=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then args+=(--tag "${GITHUB_REF_NAME}"); fi
          python scripts/verify-release.py "${args[@]}"
      - name: Build twice, compare bytes, and create package SBOMs
        run: |
          bash scripts/release-build.sh dist/release
          bash scripts/release-sbom.sh dist/release
      - name: Validate clean locked installs expose four tools per server
        run: |
          python scripts/verify-public-release.py \
            --version "${GITHUB_REF_NAME#v}" \
            --manifest dist/release/RELEASE-MANIFEST.json \
            --artifacts dist/release
      - name: Fetch and validate the pinned MCP publisher and manifests
        run: |
          mkdir -p dist/mcp-publisher
          curl --fail --location --silent --show-error \
            --output dist/mcp-publisher/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  dist/mcp-publisher/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf dist/mcp-publisher/mcp-publisher.tar.gz -C dist/mcp-publisher mcp-publisher
          dist/mcp-publisher/mcp-publisher validate dist/release/registry/evidence-gate.server.json
          dist/mcp-publisher/mcp-publisher validate dist/release/registry/release-gate.server.json
      - name: Isolate exact PyPI distribution inputs
        run: |
          mkdir -p dist/pypi/evidence-gate dist/pypi/release-gate
          cp dist/release/evidence-gate/*.whl dist/release/evidence-gate/*.tar.gz dist/pypi/evidence-gate/
          cp dist/release/release-gate/*.whl dist/release/release-gate/*.tar.gz dist/pypi/release-gate/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolkit-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-publisher-${{ github.sha }}
          path: |
            dist/mcp-publisher/mcp-publisher
            dist/mcp-publisher/mcp-publisher.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-evidence-gate-${{ github.sha }}
          path: dist/pypi/evidence-gate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-release-gate-${{ github.sha }}
          path: dist/pypi/release-gate/
          if-no-files-found: error
          retention-days: 30

  provenance-evidence-gate:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ github.sha }}
          path: dist/release
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/evidence-gate/*.whl
            dist/release/evidence-gate/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-gate-provenance-${{ github.sha }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

  provenance-release-gate:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ github.sha }}
          path: dist/release
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/release-gate/*.whl
            dist/release/release-gate/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-provenance-${{ github.sha }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

  publish-evidence-gate:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-evidence-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-evidence-gate-${{ github.sha }}
          path: dist/pypi/evidence-gate
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi/evidence-gate/
          attestations: true
          print-hash: true
          skip-existing: false

  publish-release-gate:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-release-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-release-gate-${{ github.sha }}
          path: dist/pypi/release-gate
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi/release-gate/
          attestations: true
          print-hash: true
          skip-existing: false

  verify-pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, publish-evidence-gate, publish-release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ github.sha }}
          path: dist/release
      - run: python -m pip install --require-hashes -r requirements/release.lock
      - name: Match public PyPI files to the immutable manifest and attestations
        run: |
          python scripts/release-await-pypi.py \
            --version "${GITHUB_REF_NAME#v}" \
            --manifest dist/release/RELEASE-MANIFEST.json \
            --timeout 300
          python scripts/verify-public-release.py \
            --version "${GITHUB_REF_NAME#v}" \
            --manifest dist/release/RELEASE-MANIFEST.json

  publish-mcp-evidence-gate:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    environment: mcp-registry-evidence-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ github.sha }}
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-publisher-${{ github.sha }}
          path: dist/mcp-publisher
      - name: Publish only the fixed Evidence Gate manifest
        run: |
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  dist/mcp-publisher/mcp-publisher.tar.gz" | sha256sum --check --strict
          chmod 0755 dist/mcp-publisher/mcp-publisher
          dist/mcp-publisher/mcp-publisher login github-oidc
          dist/mcp-publisher/mcp-publisher publish dist/release/registry/evidence-gate.server.json

  publish-mcp-release-gate:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    environment: mcp-registry-release-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ github.sha }}
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-publisher-${{ github.sha }}
          path: dist/mcp-publisher
      - name: Publish only the fixed Release Gate manifest
        run: |
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  dist/mcp-publisher/mcp-publisher.tar.gz" | sha256sum --check --strict
          chmod 0755 dist/mcp-publisher/mcp-publisher
          dist/mcp-publisher/mcp-publisher login github-oidc
          dist/mcp-publisher/mcp-publisher publish dist/release/registry/release-gate.server.json

  github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build
      - provenance-evidence-gate
      - provenance-release-gate
      - publish-mcp-evidence-gate
      - publish-mcp-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ github.sha }}
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: evidence-gate-provenance-${{ github.sha }}
          path: dist/provenance/evidence-gate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-gate-provenance-${{ github.sha }}
          path: dist/provenance/release-gate
      - name: Create immutable release bundle and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_bundles=(dist/provenance/evidence-gate/*)
          release_bundles=(dist/provenance/release-gate/*)
          [[ "${#evidence_bundles[@]}" -eq 1 && "${#release_bundles[@]}" -eq 1 ]]
          cp "${evidence_bundles[0]}" dist/evidence-gate-provenance.sigstore.json
          cp "${release_bundles[0]}" dist/release-gate-provenance.sigstore.json
          sha256sum dist/*-gate-provenance.sigstore.json > dist/PROVENANCE-SHA256SUMS
          for artifact in dist/release/evidence-gate/*.whl dist/release/evidence-gate/*.tar.gz; do
            gh attestation verify "$artifact" --bundle dist/evidence-gate-provenance.sigstore.json --repo "${GITHUB_REPOSITORY}"
          done
          for artifact in dist/release/release-gate/*.whl dist/release/release-gate/*.tar.gz; do
            gh attestation verify "$artifact" --bundle dist/release-gate-provenance.sigstore.json --repo "${GITHUB_REPOSITORY}"
          done
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH:-0}" --owner=0 --group=0 --numeric-owner \
            -czf "dist/daily-ai-agent-toolkit-${GITHUB_REF_NAME}-release-bundle.tar.gz" -C dist release
          gh release create "${GITHUB_REF_NAME}" \
            dist/release/SHA256SUMS \
            dist/release/RELEASE-MANIFEST.json \
            dist/release/evidence-gate/* \
            dist/release/release-gate/* \
            dist/release/demo/* \
            dist/release/docs/* \
            dist/release/registry/* \
            dist/*-gate-provenance.sigstore.json \
            dist/PROVENANCE-SHA256SUMS \
            "dist/daily-ai-agent-toolkit-${GITHUB_REF_NAME}-release-bundle.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Daily AI Agent Toolkit ${GITHUB_REF_NAME}"

  verify-github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Verify public bundle checksums and GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/download
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "daily-ai-agent-toolkit-${GITHUB_REF_NAME}-release-bundle.tar.gz" \
            --dir dist/download
          tar -xzf dist/download/*.tar.gz -C dist/download
          (cd dist/download/release && sha256sum --check SHA256SUMS)
          for artifact in dist/download/release/evidence-gate/*.whl \
            dist/download/release/evidence-gate/*.tar.gz \
            dist/download/release/release-gate/*.whl \
            dist/download/release/release-gate/*.tar.gz; do
            gh attestation verify "$artifact" --repo "${GITHUB_REPOSITORY}" --deny-self-hosted-runners
          done
