          }
          expected_workflow_ref = os.environ["WORKFLOW_CONFIG_REF"].rsplit("@", 1)[1]
          expected_workflow = {
              "uri": (
                  "git+https://github.com/"
                  f"{os.environ['GITHUB_REPOSITORY']}@{expected_workflow_ref}"
              ),
              "digest": {"gitCommit": os.environ["WORKFLOW_CONFIG_SHA"]},
          }
          expected_build_type = (
              "https://github.com/"
              f"{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['WORKFLOW_CONFIG_SHA']}"
