name: release-toolkit

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable signed release tag
        required: true
        type: string
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  MCP_PUBLISHER_VERSION: '1.8.1'
  MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  RELEASE_SIGNER_PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK0ju/G5VrPNT0cqQjbSSz4TSKezgXISf9MKVmV7mc6U
  RELEASE_SIGNER_PRINCIPAL: 261465842+dailyaiagents-cpu@users.noreply.github.com

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      tag_object_sha: ${{ steps.resolve.outputs.tag_object_sha }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - id: resolve
        name: Resolve and verify the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${DISPATCH_TAG}"
          else
            [[ "${GITHUB_REF_TYPE}" == "tag" ]]
            release_tag="${GITHUB_REF_NAME}"
          fi
          [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}")"
          [[ "$(jq -r .ref <<<"${ref_json}")" == "refs/tags/${release_tag}" ]]
          [[ "$(jq -r .object.type <<<"${ref_json}")" == "tag" ]]
          tag_object_sha="$(jq -r .object.sha <<<"${ref_json}")"
          [[ "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]]

          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          [[ "$(jq -r .sha <<<"${tag_json}")" == "${tag_object_sha}" ]]
          [[ "$(jq -r .tag <<<"${tag_json}")" == "${release_tag}" ]]
          [[ "$(jq -r .object.type <<<"${tag_json}")" == "commit" ]]
          [[ "$(jq -r .verification.verified <<<"${tag_json}")" == "true" ]]
          [[ "$(jq -r .verification.reason <<<"${tag_json}")" == "valid" ]]
          target_sha="$(jq -r .object.sha <<<"${tag_json}")"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]

          compare_json="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${target_sha}...main")"
          compare_status="$(jq -r .status <<<"${compare_json}")"
          [[ "${compare_status}" == "ahead" || "${compare_status}" == "identical" ]]
          [[ "$(jq -r .merge_base_commit.sha <<<"${compare_json}")" == "${target_sha}" ]]

          workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml")"
          [[ "$(jq -r .path <<<"${workflow_json}")" == ".github/workflows/ci.yml" ]]
          [[ "$(jq -r .state <<<"${workflow_json}")" == "active" ]]
          workflow_id="$(jq -r .id <<<"${workflow_json}")"
          [[ "${workflow_id}" =~ ^[0-9]+$ ]]

          runs_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?event=push&status=success&per_page=100")"
          run_id="$(WORKFLOW_RUNS="${runs_json}" TARGET_SHA="${target_sha}" python - <<'PY'
          import json
          import os

          rows = json.loads(os.environ["WORKFLOW_RUNS"]).get("workflow_runs", [])
          matches = [
              row
              for row in rows
              if row.get("head_sha") == os.environ["TARGET_SHA"]
              and row.get("head_branch") == "main"
              and row.get("event") == "push"
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
              and row.get("path") == ".github/workflows/ci.yml"
          ]
          if not matches:
              raise SystemExit("no successful main push run from the required CI workflow")
          print(max(matches, key=lambda row: row["id"])["id"])
          PY
          )"
          [[ "${run_id}" =~ ^[0-9]+$ ]]

          jobs_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          WORKFLOW_JOBS="${jobs_json}" TARGET_SHA="${target_sha}" python - <<'PY'
          import json
          import os

          required = {
              "test (ubuntu-latest, 3.11)",
              "test (ubuntu-latest, 3.12)",
              "test (ubuntu-latest, 3.13)",
              "test (macos-latest, 3.11)",
              "test (macos-latest, 3.12)",
              "test (macos-latest, 3.13)",
              "dependency-audit",
              "workflow-security",
          }
          rows = json.loads(os.environ["WORKFLOW_JOBS"]).get("jobs", [])
          actual = {row.get("name") for row in rows}
          if actual != required:
              raise SystemExit(
                  f"required CI job set mismatch: missing={sorted(required - actual)}, "
                  f"unexpected={sorted(actual - required)}"
              )
          invalid = [
              row.get("name")
              for row in rows
              if row.get("head_sha") != os.environ["TARGET_SHA"]
              or row.get("status") != "completed"
              or row.get("conclusion") != "success"
          ]
          if invalid:
              raise SystemExit(f"required CI jobs not successful at target SHA: {invalid}")
          PY

          {
            printf 'release_tag=%s\n' "${release_tag}"
            printf 'release_version=%s\n' "${release_tag#v}"
            printf 'tag_object_sha=%s\n' "${tag_object_sha}"
            printf 'target_sha=%s\n' "${target_sha}"
          } >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ needs.resolve-release.outputs.release_tag }}
      release_version: ${{ needs.resolve-release.outputs.release_version }}
      tag_object_sha: ${{ needs.resolve-release.outputs.tag_object_sha }}
      target_sha: ${{ needs.resolve-release.outputs.target_sha }}
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.release_version }}
      RELEASE_TAG_OBJECT_SHA: ${{ needs.resolve-release.outputs.tag_object_sha }}
      RELEASE_TARGET_SHA: ${{ needs.resolve-release.outputs.target_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve-release.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind checkout to the validated immutable tag
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_TARGET_SHA}" ]]
          git fetch --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{tag}")" == "${RELEASE_TAG_OBJECT_SHA}" ]]
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_TARGET_SHA}" ]]
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          printf '%s %s\n' "${RELEASE_SIGNER_PRINCIPAL}" "${RELEASE_SIGNER_PUBLIC_KEY}" > "${allowed_signers}"
          git -c gpg.ssh.allowedSignersFile="${allowed_signers}" verify-tag "${RELEASE_TAG}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked release and runtime environments
        run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --require-hashes -r requirements/release.lock
          python -m pip install --no-deps -e servers/evidence-gate -e servers/release-gate
      - name: Verify source, dependencies, and release metadata
        run: |
          bash scripts/test-all.sh
          pip-audit --strict --require-hashes --no-deps -r requirements/runtime.lock
          python scripts/verify-release.py --tag "${RELEASE_TAG}"
      - name: Build twice, compare bytes, and create package SBOMs
        run: |
          bash scripts/release-build.sh dist/release
          bash scripts/release-sbom.sh dist/release
      - name: Validate clean locked installs expose four tools per server
        run: |
          python scripts/verify-public-release.py \
            --version "${RELEASE_VERSION}" \
            --manifest dist/release/RELEASE-MANIFEST.json \
            --artifacts dist/release
      - name: Fetch and validate the pinned MCP publisher and manifests
        run: |
          mkdir -p dist/mcp-publisher
          curl --fail --location --silent --show-error \
            --output dist/mcp-publisher/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  dist/mcp-publisher/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf dist/mcp-publisher/mcp-publisher.tar.gz -C dist/mcp-publisher mcp-publisher
          dist/mcp-publisher/mcp-publisher validate dist/release/registry/evidence-gate.server.json
          dist/mcp-publisher/mcp-publisher validate dist/release/registry/release-gate.server.json
      - name: Isolate exact PyPI distribution inputs
        run: |
          mkdir -p dist/pypi/evidence-gate dist/pypi/release-gate
          cp dist/release/evidence-gate/*.whl dist/release/evidence-gate/*.tar.gz dist/pypi/evidence-gate/
          cp dist/release/release-gate/*.whl dist/release/release-gate/*.tar.gz dist/pypi/release-gate/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolkit-release-${{ needs.resolve-release.outputs.target_sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-publisher-${{ needs.resolve-release.outputs.target_sha }}
          path: |
            dist/mcp-publisher/mcp-publisher
            dist/mcp-publisher/mcp-publisher.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-evidence-gate-${{ needs.resolve-release.outputs.target_sha }}
          path: dist/pypi/evidence-gate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-release-gate-${{ needs.resolve-release.outputs.target_sha }}
          path: dist/pypi/release-gate/
          if-no-files-found: error
          retention-days: 30

  provenance-evidence-gate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_TARGET_SHA: ${{ needs.build.outputs.target_sha }}
      WORKFLOW_CONFIG_REF: ${{ github.workflow_ref }}
      WORKFLOW_CONFIG_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolkit-release-${{ needs.build.outputs.target_sha }}
          path: dist/release
      - name: Describe the tagged source and reviewed workflow inputs
        run: |
          set -euo pipefail
          workflow_git_ref="${WORKFLOW_CONFIG_REF##*@}"
          [[ "${workflow_git_ref}" == refs/heads/* || "${workflow_git_ref}" == refs/tags/* ]]
          jq -n \
            --arg build_type "https://github.com/${GITHUB_REPOSITORY}/blob/${WORKFLOW_CONFIG_SHA}/docs/RELEASE-RESUME-PROVENANCE.md" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg target_sha "${RELEASE_TARGET_SHA}" \
            --arg workflow_ref "${WORKFLOW_CONFIG_REF}" \
            --arg workflow_git_ref "${workflow_git_ref}" \
            --arg workflow_sha "${WORKFLOW_CONFIG_SHA}" \
            --arg invocation "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            '{
              buildDefinition: {
                buildType: $build_type,
                externalParameters: {
                  releaseTag: $release_tag,
                  workflowRef: $workflow_ref
                },
                internalParameters: {},
                resolvedDependencies: [
                  {
                    uri: ("git+https://github.com/" + $repository + "@refs/tags/" + $release_tag),
                    digest: {gitCommit: $target_sha},
                    annotations: {"dailyaiagents_role": "release-source"}
                  },
                  {
                    uri: ("git+https://github.com/" + $repository + "@" + $workflow_git_ref),
                    digest: {gitCommit: $workflow_sha},
                    annotations: {"dailyaiagents_role": "release-workflow"}
                  }
                ]
              },
              runDetails: {
                builder: {
                  id: ("https://github.com/" + $repository + "/.github/workflows/release-evidence.yml@" + $workflow_git_ref)
                },
                metadata: {invocationId: $invocation}
              }
            }' > provenance-predicate.json
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/evidence-gate/*.whl
            dist/release/evidence-gate/*.tar.gz
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: provenance-predicate.json
      - name: Cryptographically verify the signed predicate and build context
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for artifact in dist/release/evidence-gate/*.whl dist/release/evidence-gate/*.tar.gz; do
            verification="$(gh attestation verify "${artifact}" \
              --bundle "${BUNDLE_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml" \
              --signer-digest "${WORKFLOW_CONFIG_SHA}" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json)"
            ATTESTATION="${verification}" python - <<'PY'
          import json
          import os

          rows = json.loads(os.environ["ATTESTATION"])
          expected_source = {
              "uri": (
                  "git+https://github.com/"
                  f"{os.environ['GITHUB_REPOSITORY']}@refs/tags/{os.environ['RELEASE_TAG']}"
              ),
              "digest": {"gitCommit": os.environ["RELEASE_TARGET_SHA"]},
          }
          expected_workflow_ref = os.environ["WORKFLOW_CONFIG_REF"].rsplit("@", 1)[1]
          expected_workflow = {
              "uri": (
                  "git+https://github.com/"
                  f"{os.environ['GITHUB_REPOSITORY']}@{expected_workflow_ref}"
              ),
              "digest": {"gitCommit": os.environ["WORKFLOW_CONFIG_SHA"]},
          }
          expected_build_type = (
              "https://github.com/"
              f"{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['WORKFLOW_CONFIG_SHA']}"
              "/docs/RELEASE-RESUME-PROVENANCE.md"
          )
          predicates = [row["verificationResult"]["statement"]["predicate"] for row in rows]
          def contains(dependencies, expected):
              return any(
                  item.get("uri") == expected["uri"]
                  and item.get("digest") == expected["digest"]
                  for item in dependencies
              )

          if not any(
              predicate.get("buildDefinition", {}).get("buildType") == expected_build_type
              and predicate.get("buildDefinition", {}).get("externalParameters")
              == {
                  "releaseTag": os.environ["RELEASE_TAG"],
                  "workflowRef": os.environ["WORKFLOW_CONFIG_REF"],
              }
              and contains(
                  predicate.get("buildDefinition", {}).get("resolvedDependencies", []),
                  expected_source,
              )
              and contains(
                  predicate.get("buildDefinition", {}).get("resolvedDependencies", []),
                  expected_workflow,
              )
              for predicate in predicates
          ):
              raise SystemExit("signed provenance does not bind release source and workflow inputs")
          PY
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-gate-provenance-${{ needs.build.outputs.target_sha }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

  provenance-release-gate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_TARGET_SHA: ${{ needs.build.outputs.target_sha }}
      WORKFLOW_CONFIG_REF: ${{ github.workflow_ref }}
      WORKFLOW_CONFIG_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
