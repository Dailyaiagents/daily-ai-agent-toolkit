name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install hash-locked runtime and verification dependencies
        run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --require-hashes -r requirements/release.lock
          python -m pip install --no-deps -e servers/evidence-gate -e servers/release-gate
      - run: bash scripts/test-all.sh
      - run: python scripts/verify-release.py
      - run: python -m build --no-isolation servers/evidence-gate
      - run: python -m build --no-isolation servers/release-gate

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/release.lock
      - run: pip-audit --strict --require-hashes --no-deps -r requirements/runtime.lock

  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/release.lock
      - name: Install checksum-pinned actionlint
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
      - run: zizmor .github/workflows
